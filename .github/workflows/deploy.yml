name: Deploy NYX Edge Function

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/nyx-intelligence/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy NYX function
        run: supabase functions deploy nyx-intelligence --project-ref wjlhqrzaihtsuhuyqcau --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
